[package]
name = "tiniread"
version = "0.1.0"
description = "TiniRead Local Markdown Reader & Editor"
authors = ["TiniRead"]
edition = "2021"

[lib]
name = "tiniread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
dirs = "5.0"
