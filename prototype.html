<!DOCTYPE html>
<html lang="zh-CN" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkView - 本地 Markdown 编辑与阅读器</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg-window: #f4f4f6;
      --bg-sidebar: #f8f8fa;
      --bg-card: #ffffff;
      --bg-reader: #ffffff;
      --border-subtle: #ececef;
      --border-strong: #e1e1e6;
      --text-main: #18181b;
      --text-muted: #71717a;
      --text-light: #a1a1aa;
      --accent-pill: #18181b;
      --accent-text: #ffffff;
      --highlight-yellow: #fef08a;
      --highlight-green: #bbf7d0;
      --highlight-blue: #bfdbfe;
      --callout-bg: #f9f9fb;
      --callout-border: #e4e4e7;
    }

    html.theme-warm {
      --bg-window: #f5f2eb;
      --bg-sidebar: #faf7f0;
      --bg-card: #fffdf9;
      --bg-reader: #fffdf9;
      --border-subtle: #ede6d8;
      --border-strong: #e2d8c3;
      --text-main: #292524;
      --text-muted: #78716c;
      --text-light: #a8a29e;
      --accent-pill: #292524;
      --accent-text: #faf7f0;
      --highlight-yellow: #fde68a;
      --highlight-green: #cbd5e1;
      --highlight-blue: #e2e8f0;
      --callout-bg: #f5eee1;
      --callout-border: #e6dac6;
    }

    html.theme-dark {
      --bg-window: #121214;
      --bg-sidebar: #18181b;
      --bg-card: #202024;
      --bg-reader: #1a1a1e;
      --border-subtle: #27272a;
      --border-strong: #3f3f46;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-light: #71717a;
      --accent-pill: #f4f4f5;
      --accent-text: #18181b;
      --highlight-yellow: #713f12;
      --highlight-green: #14532d;
      --highlight-blue: #1e3a8a;
      --callout-bg: #222227;
      --callout-border: #333338;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-window);
      color: var(--text-main);
      user-select: none;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .editor-body {
      user-select: text;
      outline: none;
    }

    .editor-body:focus {
      outline: none;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-light);
      border-radius: 999px;
      opacity: 0.25;
    }

    body.platform-mac #header-left-group {
      padding-left: 68px;
    }
    body.platform-win #header-left-group {
      padding-left: 0;
    }

    #dynamic-toc {
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color 0.25s ease;
    }
    #dynamic-toc::-webkit-scrollbar {
      width: 4px;
    }
    #dynamic-toc::-webkit-scrollbar-track {
      background: transparent;
    }
    #dynamic-toc::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 999px;
      transition: background-color 0.25s ease;
    }
    #dynamic-toc.scrolling {
      scrollbar-color: var(--text-light) transparent;
    }
    #dynamic-toc.scrolling::-webkit-scrollbar-thumb {
      background: var(--text-light);
    }
    #dynamic-toc.scrolling::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    mark.hl-yellow {
      background-color: var(--highlight-yellow);
      color: inherit;
      padding: 2px 5px;
      border-radius: 4px;
    }
    mark.hl-green {
      background-color: var(--highlight-green);
      color: inherit;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .prose h1, .prose h2, .prose h3 {
      scroll-margin-top: 48px;
    }

    [contenteditable="true"]:empty:before {
      content: attr(placeholder);
      color: var(--text-light);
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col antialiased overflow-hidden">

  <!-- Desktop App Container Window -->
  <div class="flex-1 bg-[var(--bg-card)] flex flex-col overflow-hidden relative">

    <!-- Top Window Titlebar -->
    <header class="h-11 border-b border-[var(--border-subtle)] px-4 flex items-center justify-between shrink-0 bg-[var(--bg-card)]">
      
      <!-- Window Controls & View Modes -->
      <div id="header-left-group" class="flex items-center gap-2">
        <!-- View mode switcher: 专注 (默认) / 双栏 / 三栏 -->
        <div class="flex items-center bg-[var(--bg-window)] p-0.5 rounded-lg border border-[var(--border-subtle)] text-xs text-[var(--text-muted)]">
          <button id="view-mode-focus" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--bg-card)] text-[var(--text-main)] shadow-sm font-medium transition" title="专注模式 (仅正文阅读)">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="2" />
            </svg>
            <span>专注</span>
          </button>
          <button id="view-mode-two" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md hover:text-[var(--text-main)] transition" title="双栏视图 (文档列表 + 正文)">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <line x1="10" y1="4" x2="10" y2="20" />
            </svg>
            <span>双栏</span>
          </button>
          <button id="view-mode-three" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md hover:text-[var(--text-main)] transition" title="三栏视图 (目录 + 列表 + 正文)">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <line x1="8" y1="4" x2="8" y2="20" />
              <line x1="14" y1="4" x2="14" y2="20" />
            </svg>
            <span>三栏</span>
          </button>
        </div>

        <!-- Rendered / Source toggle -->
        <div class="flex items-center bg-[var(--bg-window)] p-0.5 rounded-lg border border-[var(--border-subtle)] text-xs text-[var(--text-muted)]">
          <button id="toggle-view-rendered" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--bg-card)] text-[var(--text-main)] shadow-sm font-medium transition" title="阅读模式">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>阅读</span>
          </button>
          <button id="toggle-view-source" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md hover:text-[var(--text-main)] transition" title="文本模式">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
            <span>文本</span>
          </button>
        </div>
      </div>

      <!-- Center Status / Document Title -->
      <div class="flex items-center text-xs text-[var(--text-main)] font-semibold truncate max-w-[360px]">
        <span id="header-doc-title">MarkView 架构设计规范</span>
      </div>

      <!-- Right Action Tools -->
      <div class="flex items-center gap-2">
        <button id="insert-block-quick-btn" class="flex items-center gap-1 px-2.5 py-1 text-xs font-medium text-[var(--text-main)] bg-[var(--bg-window)] border border-[var(--border-subtle)] rounded-lg hover:border-[var(--text-light)] transition" title="插入">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>插入</span>
        </button>

        <button id="open-file-btn" class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-[var(--text-main)] bg-[var(--bg-window)] border border-[var(--border-subtle)] rounded-lg hover:border-[var(--text-light)] transition" title="导入">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span>导入</span>
        </button>

        <!-- Theme Switcher -->
        <div class="relative">
          <button id="theme-btn" class="p-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-window)] text-[var(--text-muted)] hover:text-[var(--text-main)] transition" title="切换风格">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5" />
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
          </button>
          <div id="theme-dropdown" class="absolute right-0 top-full mt-1.5 w-32 bg-[var(--bg-card)] border border-[var(--border-subtle)] rounded-xl shadow-lg p-1 hidden z-50 text-xs">
            <button data-theme="theme-light" class="theme-opt w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] font-medium text-[var(--text-main)]">浅灰冷白</button>
            <button data-theme="theme-warm" class="theme-opt w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] text-[var(--text-muted)]">温润羊皮</button>
            <button data-theme="theme-dark" class="theme-opt w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] text-[var(--text-muted)]">深邃极夜</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="flex-1 flex overflow-hidden">

      <!-- Column 1: Left Navigation Sidebar (默认在专注模式下隐藏) -->
      <aside id="col-sidebar" class="w-52 bg-[var(--bg-sidebar)] border-r border-[var(--border-subtle)] flex flex-col justify-between shrink-0 transition-all duration-200 hidden">
        
        <div class="p-3 space-y-4">
          <div class="flex items-center gap-2.5 px-2 py-1">
            <div class="w-6 h-6 rounded-lg bg-[var(--text-main)] text-[var(--bg-card)] flex items-center justify-center font-bold text-xs">
              M
            </div>
            <span class="font-bold text-sm tracking-tight text-[var(--text-main)]">MarkView</span>
          </div>

          <nav class="space-y-1 text-xs">
            <button class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl bg-[var(--accent-pill)] text-[var(--accent-text)] font-semibold transition shadow-sm">
              <div class="flex items-center gap-2.5">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                <span>工作区文档</span>
              </div>
              <span id="doc-count-badge" class="text-[11px] font-mono opacity-80">0</span>
            </button>
          </nav>

          <div class="pt-2">
            <div class="flex items-center justify-between px-2 pb-2 text-[11px] font-semibold text-[var(--text-light)]">
              <span>文档列表</span>
            </div>
            <div id="tree-container" class="space-y-0.5 text-xs overflow-y-auto max-h-64">
              <!-- Dynamically populated from /api/workspace -->
            </div>
          </div>
        </div>
      </aside>

      <!-- Column 2: Document Card List (默认在专注模式下隐藏) -->
      <section id="col-list" class="w-72 bg-[var(--bg-card)] border-r border-[var(--border-subtle)] flex flex-col shrink-0 hidden">
        
        <div class="p-3 border-b border-[var(--border-subtle)] flex items-center justify-between gap-2">
          <div class="flex-1 flex items-center gap-2 px-2.5 py-1.5 rounded-xl bg-[var(--bg-window)] border border-[var(--border-subtle)] text-xs">
            <svg class="w-3.5 h-3.5 text-[var(--text-light)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input id="filter-input" type="text" placeholder="筛选文档与标题..." class="w-full bg-transparent text-[var(--text-main)] outline-none placeholder-[var(--text-light)] text-xs">
          </div>
          <button id="add-doc-btn" class="p-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-window)] text-[var(--text-main)] hover:bg-[var(--text-main)] hover:text-white transition" title="新建空白文档">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>

        <div id="cards-container" class="flex-1 overflow-y-auto p-3 space-y-2.5">
          <!-- Dynamically populated document cards -->
        </div>
      </section>

      <!-- Column 3: In-Place Editable Markdown Reader & Editor -->
      <main id="col-reader" class="flex-1 bg-[var(--bg-reader)] flex flex-col overflow-hidden relative">
        
        <div id="reader-scroll-area" class="flex-1 overflow-y-auto flex justify-center relative scroll-smooth">
          <!-- Floating Typora Style Outline (TOC) -->
          <aside class="sticky top-6 right-6 self-start ml-auto mr-6 z-20 hidden lg:flex flex-col w-48 max-h-[calc(100vh-140px)] p-3 rounded-2xl bg-[var(--bg-card)]/95 backdrop-blur-md border border-[var(--border-subtle)] shadow-sm text-xs">
            <div class="flex items-center justify-between text-[10px] font-semibold text-[var(--text-light)] uppercase tracking-wider pb-1.5 mb-1.5 border-b border-[var(--border-subtle)] shrink-0">
              <span>实时大纲</span>
              <span id="read-progress" class="font-mono">0%</span>
            </div>
            <div id="dynamic-toc" class="space-y-1 text-[11px] text-[var(--text-muted)] overflow-y-auto max-h-[calc(100vh-190px)] pr-1">
              <!-- Dynamic Headings -->
            </div>
          </aside>

          <!-- Markdown Document Container -->
          <div class="w-full max-w-3xl px-8 md:px-12 py-10 space-y-6 absolute left-1/2 -translate-x-1/2">
            
            <!-- Document Rendered & Editable Body -->
            <div id="editor-content" contenteditable="true" class="editor-body text-[14px] leading-relaxed text-[var(--text-main)] cursor-text space-y-4" placeholder="在此自由编写文字，支持右键一键插入标题与块，或选中文字调整格式...">
              <!-- Rendered Markdown DOM elements will be injected here -->
            </div>

            <!-- Plain Markdown Text Mode (Hidden by default) -->
            <textarea id="editor-source" class="w-full min-h-[calc(100vh-260px)] p-0 bg-transparent text-[14px] leading-7 text-[var(--text-main)] font-mono outline-none border-none resize-none hidden overflow-hidden placeholder-[var(--text-light)]" placeholder="在此输入 Markdown 纯文本..."></textarea>

            <div class="pt-8 pb-10 text-center text-xs text-[var(--text-light)] font-mono">
              — 尽览于此 · MarkView —
            </div>

          </div>
        </div>

        <!-- Reader Bottom Status Bar -->
        <footer class="h-8 px-6 border-t border-[var(--border-subtle)] bg-[var(--bg-card)]/80 backdrop-blur-sm flex items-center justify-between text-xs text-[var(--text-muted)] shrink-0 select-none z-10">
          <div class="flex items-center gap-2">
            <span>当前字数</span>
            <span class="font-mono font-medium text-[var(--text-main)]" id="bottom-stat-words">0 字</span>
          </div>
          <div class="flex items-center gap-3 text-[11px] text-[var(--text-light)]">
            <span id="save-status-text" class="transition-opacity duration-200 opacity-0 font-medium">已保存</span>
            <span id="shortcut-hint" class="font-mono text-[10px] hidden sm:inline">Ctrl+S 保存</span>
          </div>
        </footer>
      </main>

    </div>

    <!-- Floating Text Selection Bubble Toolbar -->
    <div id="selection-toolbar" class="fixed hidden z-50 bg-[var(--text-main)] text-[var(--bg-card)] rounded-xl shadow-2xl p-1 items-center gap-0.5 text-xs transition-opacity duration-150">
      <button data-cmd="bold" class="fmt-btn px-2 py-1 rounded-lg hover:bg-white/20 font-bold transition" title="加粗">B</button>
      <button data-cmd="italic" class="fmt-btn px-2 py-1 rounded-lg hover:bg-white/20 italic transition" title="斜体">I</button>
      <button data-cmd="strikeThrough" class="fmt-btn px-2 py-1 rounded-lg hover:bg-white/20 line-through transition" title="删除线">S</button>
      <div class="w-px h-3.5 bg-white/20 mx-1"></div>
      <button id="fmt-hl-yellow" class="px-2 py-1 rounded-lg hover:bg-white/20 text-yellow-300 font-semibold transition" title="黄高亮">黄高亮</button>
      <button id="fmt-hl-green" class="px-2 py-1 rounded-lg hover:bg-white/20 text-emerald-300 font-semibold transition" title="绿高亮">绿高亮</button>
      <div class="w-px h-3.5 bg-white/20 mx-1"></div>
      <button id="fmt-h1" class="px-2 py-1 rounded-lg hover:bg-white/20 font-medium transition" title="设为一级标题">H1</button>
      <button id="fmt-h2" class="px-2 py-1 rounded-lg hover:bg-white/20 font-medium transition" title="设为二级标题">H2</button>
      <button id="fmt-code" class="px-2 py-1 rounded-lg hover:bg-white/20 font-mono text-[11px] transition" title="行内代码">&lt;/&gt;</button>
    </div>

    <!-- Context Menu for Right-Click -->
    <div id="editor-context-menu" class="fixed hidden z-50 w-44 bg-[var(--bg-card)] border border-[var(--border-subtle)] rounded-2xl shadow-2xl p-1.5 text-xs text-[var(--text-main)]">
      <div class="px-2.5 py-1 text-[10px] font-semibold text-[var(--text-light)] uppercase tracking-wider">插入标题</div>
      <button data-insert="h1" class="ctx-item w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] flex items-center justify-between font-semibold">
        <span>一级标题</span>
        <span class="text-[10px] font-mono text-[var(--text-light)]"># H1</span>
      </button>
      <button data-insert="h2" class="ctx-item w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] flex items-center justify-between font-medium">
        <span>二级标题</span>
        <span class="text-[10px] font-mono text-[var(--text-light)]">## H2</span>
      </button>
      <button data-insert="h3" class="ctx-item w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] flex items-center justify-between">
        <span>三级标题</span>
        <span class="text-[10px] font-mono text-[var(--text-light)]">### H3</span>
      </button>
      <div class="my-1 border-t border-[var(--border-subtle)]"></div>
      <div class="px-2.5 py-1 text-[10px] font-semibold text-[var(--text-light)] uppercase tracking-wider">常用块组件</div>
      <button data-insert="task" class="ctx-item w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 11 12 14 22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
        <span>待办清单</span>
      </button>
      <button data-insert="callout" class="ctx-item w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>提示引语盒</span>
      </button>
      <button data-insert="code" class="ctx-item w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="16 18 22 12 16 6" />
          <polyline points="8 6 2 12 8 18" />
        </svg>
        <span>代码块</span>
      </button>
      <button data-insert="divider" class="ctx-item w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[var(--bg-window)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span>分割线</span>
      </button>
    </div>

    <!-- Drag & Drop Indicator -->
    <div id="drag-drop-mask" class="absolute inset-0 bg-[var(--bg-card)]/90 backdrop-blur-md border-2 border-dashed border-[var(--text-main)] z-50 hidden flex-col items-center justify-center pointer-events-none transition-all">
      <div class="w-14 h-14 rounded-2xl bg-[var(--bg-window)] border border-[var(--border-subtle)] flex items-center justify-center text-[var(--text-main)] shadow-sm mb-3">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
      </div>
      <div class="text-sm font-bold text-[var(--text-main)]">释放导入文件</div>
    </div>

  </div>

  <input type="file" id="local-file-input" accept=".md,.markdown,.txt" class="hidden">

  <!-- Interactive Scripts & Full Markdown Parsing Engine -->
  <script>
    const isMac = /macintosh|mac os x/i.test(navigator.userAgent);
    document.body.classList.add(isMac ? 'platform-mac' : 'platform-win');

    let currentDocPath = '';
    let currentRawMarkdown = '';

    // ==========================================
    // 核心引擎：完整 Markdown 语法解析与 DOM 渲染
    // ==========================================
    function parseMarkdownToHtml(rawMd) {
      if (!rawMd) return '<p class="text-sm text-[var(--text-light)]">暂无内容，点击开始编写...</p>';
      
      const lines = rawMd.replace(/\r\n/g, '\n').split('\n');
      let html = [];
      let inCode = false;
      let codeLang = '';
      let codeLines = [];
      let inTable = false;
      let tableRows = [];
      let inList = false;
      let listType = '';
      let quoteBuffer = [];
      let paraBuffer = [];

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function inlineFormat(text) {
        let s = escapeHtml(text);
        // Highlights: ==text==
        s = s.replace(/==([^=]+)==/g, '<mark class="hl-yellow">$1</mark>');
        // Bold + Italic: ***text***
        s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong class="font-semibold text-[var(--text-main)]"><em class="italic">$1</em></strong>');
        // Bold: **text** or __text__
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold text-[var(--text-main)]">$1</strong>');
        s = s.replace(/__([^_]+)__/g, '<strong class="font-semibold text-[var(--text-main)]">$1</strong>');
        // Italic: *text* or _text_
        s = s.replace(/\*([^*]+)\*/g, '<em class="italic">$1</em>');
        s = s.replace(/_([^_]+)_/g, '<em class="italic">$1</em>');
        // Strikethrough: ~~text~~
        s = s.replace(/~~([^~]+)~~/g, '<del class="line-through text-[var(--text-light)]">$1</del>');
        // Inline code: `code`
        s = s.replace(/`([^`]+)`/g, '<code class="font-mono text-xs bg-[var(--bg-window)] px-1.5 py-0.5 rounded text-purple-600">$1</code>');
        // Images: ![alt](url)
        s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="rounded-xl border border-[var(--border-subtle)] my-3 max-w-full shadow-sm">');
        // Links: [text](url)
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-[var(--text-main)] underline decoration-[var(--border-strong)] hover:text-blue-600 transition">$1</a>');
        return s;
      }

      function flushParagraph() {
        if (paraBuffer.length > 0) {
          html.push(`<p class="text-[14px] leading-7 text-[var(--text-main)] my-3.5">${paraBuffer.map(inlineFormat).join('<br>')}</p>`);
          paraBuffer = [];
        }
      }

      function flushList() {
        if (inList) {
          html.push(`</${listType}>`);
          inList = false;
          listType = '';
        }
      }

      function flushQuote() {
        if (quoteBuffer.length > 0) {
          let firstLine = quoteBuffer[0];
          let alertMatch = firstLine.match(/^\[!(NOTE|TIP|WARNING|IMPORTANT|CAUTION)\]\s*(.*)/i);
          let icon = '<div class="w-5 h-5 rounded-lg bg-[var(--text-main)] text-[var(--bg-card)] flex items-center justify-center shrink-0 text-[10px] font-bold mt-0.5">!</div>';
          let calloutClass = 'p-4 rounded-2xl bg-[var(--callout-bg)] border border-[var(--callout-border)] flex items-start gap-3 text-sm leading-relaxed text-[var(--text-main)] my-4';

          if (alertMatch) {
            let type = alertMatch[1].toUpperCase();
            let firstBody = alertMatch[2];
            let allLines = [];
            if (firstBody) allLines.push(firstBody);
            for (let k = 1; k < quoteBuffer.length; k++) {
              allLines.push(quoteBuffer[k]);
            }
            html.push(`
              <div class="${calloutClass}">
                ${icon}
                <div>
                  <div class="font-semibold text-[var(--text-main)] mb-1">${type}</div>
                  <div>${allLines.map(inlineFormat).join('<br>')}</div>
                </div>
              </div>
            `);
          } else {
            html.push(`
              <div class="${calloutClass}">
                ${icon}
                <div>${quoteBuffer.map(inlineFormat).join('<br>')}</div>
              </div>
            `);
          }
          quoteBuffer = [];
        }
      }

      function flushTable() {
        if (inTable && tableRows.length > 0) {
          let tHtml = '<div class="overflow-x-auto my-3 border border-[var(--border-subtle)] rounded-xl"><table class="w-full text-left text-xs">';
          let hasHeader = false;
          let headerRow = null;
          let dataRows = [];

          if (tableRows.length >= 2 && tableRows[1].every(c => /^[-:| ]+$/.test(c))) {
            hasHeader = true;
            headerRow = tableRows[0];
            dataRows = tableRows.slice(2);
          } else {
            dataRows = tableRows;
          }

          if (hasHeader && headerRow) {
            tHtml += '<thead class="bg-[var(--bg-window)] border-b border-[var(--border-subtle)] text-[var(--text-muted)]"><tr>';
            headerRow.forEach(c => {
              tHtml += `<th class="py-2.5 px-3 font-semibold">${inlineFormat(c)}</th>`;
            });
            tHtml += '</tr></thead>';
          }
          tHtml += '<tbody class="divide-y divide-[var(--border-subtle)]">';
          dataRows.forEach(row => {
            tHtml += '<tr class="hover:bg-[var(--bg-window)]/50">';
            row.forEach(c => {
              tHtml += `<td class="py-2.5 px-3 text-[var(--text-main)]">${inlineFormat(c)}</td>`;
            });
            tHtml += '</tr>';
          });
          tHtml += '</tbody></table></div>';
          html.push(tHtml);
          inTable = false;
          tableRows = [];
        }
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        let trimmed = line.trim();

        // 1. Fenced Code blocks
        if (trimmed.startsWith('```')) {
          if (inCode) {
            const rawCode = codeLines.join('\n');
            const escapedCode = escapeHtml(rawCode);
            html.push(`
              <div class="rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-window)] overflow-hidden my-3">
                <div class="flex items-center justify-between px-4 py-2 border-b border-[var(--border-subtle)] text-[11px] text-[var(--text-muted)]">
                  <span class="font-mono font-medium text-[var(--text-main)]">${codeLang || 'plaintext'}</span>
                  <button class="copy-btn hover:text-[var(--text-main)] transition font-medium" data-code="${escapeHtml(rawCode)}">复制</button>
                </div>
                <pre class="p-4 text-xs font-mono overflow-x-auto leading-6 text-[var(--text-main)]"><code>${escapedCode}</code></pre>
              </div>
            `);
            inCode = false;
            codeLang = '';
            codeLines = [];
          } else {
            flushParagraph();
            flushList();
            flushQuote();
            flushTable();
            inCode = true;
            codeLang = trimmed.substring(3).trim();
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        // 2. Tables
        if (trimmed.includes('|') && (trimmed.startsWith('|') || trimmed.endsWith('|') || trimmed.split('|').length >= 3)) {
          flushParagraph();
          flushList();
          flushQuote();
          inTable = true;
          let raw = trimmed;
          if (raw.startsWith('|')) raw = raw.substring(1);
          if (raw.endsWith('|')) raw = raw.substring(0, raw.length - 1);
          let cols = raw.split('|').map(c => c.trim());
          tableRows.push(cols);
          continue;
        } else if (inTable) {
          flushTable();
        }

        // Blank lines
        if (trimmed === '') {
          flushParagraph();
          flushList();
          flushQuote();
          continue;
        }

        // 3. Headings #, ##, ###, ####
        if (trimmed.startsWith('#')) {
          flushParagraph();
          flushList();
          flushQuote();
          let level = 0;
          while (level < trimmed.length && trimmed[level] === '#') {
            level++;
          }
          if (trimmed[level] === ' ' || level === trimmed.length) {
            let text = trimmed.substring(level).trim();
            let hTag = `h${Math.min(level, 6)}`;
            let hClass = level === 1 ? 'text-2xl md:text-3xl font-bold text-[var(--text-main)] tracking-tight mt-7 mb-4 pb-2.5 border-b border-[var(--border-subtle)]' :
                         level === 2 ? 'text-xl font-bold text-[var(--text-main)] tracking-tight mt-8 mb-3' :
                         level === 3 ? 'text-base font-bold text-[var(--text-main)] tracking-tight mt-6 mb-2' :
                         'text-sm font-bold text-[var(--text-main)] tracking-tight mt-4 mb-2';
            html.push(`<${hTag} class="${hClass}">${inlineFormat(text)}</${hTag}>`);
            continue;
          }
        }

        // 4. Horizontal rules
        if (/^([-*_]){3,}$/.test(trimmed)) {
          flushParagraph();
          flushList();
          flushQuote();
          html.push('<hr class="my-6 border-t border-[var(--border-subtle)]">');
          continue;
        }

        // 5. Blockquote & Notion Callouts >
        if (trimmed.startsWith('>')) {
          flushParagraph();
          flushList();
          let quoteText = trimmed.substring(1).trim();
          quoteBuffer.push(quoteText);
          continue;
        } else if (quoteBuffer.length > 0) {
          flushQuote();
        }

        // 6. Task lists: - [ ] or - [x] or * [ ]
        let taskMatch = trimmed.match(/^[-*+]\s+\[([ xX])\]\s+(.*)/);
        if (taskMatch) {
          flushParagraph();
          flushList();
          flushQuote();
          let isChecked = taskMatch[1].toLowerCase() === 'x';
          let taskText = taskMatch[2];
          html.push(`
            <div class="flex items-center gap-3 p-1 rounded-xl hover:bg-[var(--bg-window)] cursor-pointer transition">
              <input type="checkbox" ${isChecked ? 'checked' : ''} class="w-4 h-4 rounded-md border-[var(--border-strong)] text-[var(--text-main)] focus:ring-0">
              <span class="${isChecked ? 'line-through text-[var(--text-light)]' : 'text-[var(--text-main)]'} text-[14px] leading-relaxed">${inlineFormat(taskText)}</span>
            </div>
          `);
          continue;
        }

        // 7. Unordered lists: - or * or +
        let ulMatch = trimmed.match(/^[-*+]\s+(.*)/);
        if (ulMatch) {
          flushParagraph();
          flushQuote();
          if (!inList || listType !== 'ul') {
            flushList();
            inList = true;
            listType = 'ul';
            html.push('<ul class="list-disc pl-6 my-3 space-y-1.5 text-[14px] leading-7 text-[var(--text-main)]">');
          }
          html.push(`<li>${inlineFormat(ulMatch[1])}</li>`);
          continue;
        }

        // 8. Ordered lists: 1. 2.
        let olMatch = trimmed.match(/^(\d+)\.\s+(.*)/);
        if (olMatch) {
          flushParagraph();
          flushQuote();
          if (!inList || listType !== 'ol') {
            flushList();
            inList = true;
            listType = 'ol';
            html.push('<ol class="list-decimal pl-6 my-3 space-y-1.5 text-[14px] leading-7 text-[var(--text-main)]">');
          }
          html.push(`<li>${inlineFormat(olMatch[2])}</li>`);
          continue;
        }

        // Regular paragraph
        flushList();
        flushQuote();
        paraBuffer.push(trimmed);
      }

      flushParagraph();
      flushList();
      flushQuote();
      flushTable();

      return html.join('\n');
    }

    // ----------------------------------------------------
    // Markdown Serializer: DOM -> Markdown
    // ----------------------------------------------------
    function inlineNodeToMarkdown(node) {
      if (!node) return '';
      if (node.nodeType === Node.TEXT_NODE) {
        return node.textContent;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) {
        return '';
      }
      const tag = node.tagName.toLowerCase();
      if (tag === 'button') return '';
      const childrenMd = Array.from(node.childNodes).map(inlineNodeToMarkdown).join('');
      
      if (tag === 'strong' || tag === 'b') {
        const text = childrenMd.trim();
        return text ? `**${text}**` : '';
      }
      if (tag === 'em' || tag === 'i') {
        const text = childrenMd.trim();
        return text ? `*${text}*` : '';
      }
      if (tag === 'del' || tag === 's') {
        const text = childrenMd.trim();
        return text ? `~~${text}~~` : '';
      }
      if (tag === 'mark') {
        const text = childrenMd.trim();
        return text ? `==${text}==` : '';
      }
      if (tag === 'code' && node.parentElement?.tagName.toLowerCase() !== 'pre') {
        return `\`${node.textContent}\``;
      }
      if (tag === 'a') {
        const href = node.getAttribute('href') || '#';
        return `[${childrenMd.trim()}](${href})`;
      }
      if (tag === 'img') {
        const alt = node.getAttribute('alt') || '';
        const src = node.getAttribute('src') || '';
        return `![${alt}](${src})`;
      }
      if (tag === 'br') {
        return '\n';
      }
      return childrenMd;
    }

    function domToMarkdown(container) {
      const parts = [];
      const children = Array.from(container.childNodes);

      for (let i = 0; i < children.length; i++) {
        const el = children[i];
        if (el.nodeType === Node.TEXT_NODE) {
          const text = el.textContent.trim();
          if (text) parts.push(text);
          continue;
        }
        if (el.nodeType !== Node.ELEMENT_NODE) continue;

        const tag = el.tagName.toLowerCase();

        // 1. Headings
        if (/^h[1-6]$/.test(tag)) {
          const level = parseInt(tag[1], 10);
          const prefix = '#'.repeat(level);
          const text = inlineNodeToMarkdown(el).trim();
          parts.push(`${prefix} ${text}`);
          continue;
        }

        // 2. Horizontal Rules
        if (tag === 'hr') {
          parts.push('---');
          continue;
        }

        // 3. Code Blocks
        const preEl = tag === 'pre' ? el : el.querySelector('pre');
        if (preEl) {
          const codeEl = preEl.querySelector('code') || preEl;
          const langEl = el.querySelector('span.font-mono');
          const lang = langEl ? langEl.textContent.trim() : '';
          const code = (codeEl.innerText || codeEl.textContent || '').replace(/\r\n/g, '\n').replace(/\n$/, '');
          const langHeader = (lang && lang !== 'plaintext') ? lang : '';
          parts.push(`\`\`\`${langHeader}\n${code}\n\`\`\``);
          continue;
        }

        // 4. Task items (div with checkbox)
        const checkbox = el.querySelector('input[type="checkbox"]');
        if (checkbox) {
          const label = el.querySelector('span') || el;
          const taskText = inlineNodeToMarkdown(label).trim();
          const mark = checkbox.checked ? 'x' : ' ';
          parts.push(`- [${mark}] ${taskText}`);
          continue;
        }

        // 5. Unordered List
        if (tag === 'ul') {
          const items = Array.from(el.querySelectorAll(':scope > li')).map(li => {
            return `- ${inlineNodeToMarkdown(li).trim()}`;
          });
          if (items.length > 0) parts.push(items.join('\n'));
          continue;
        }

        // 6. Ordered List
        if (tag === 'ol') {
          const items = Array.from(el.querySelectorAll(':scope > li')).map((li, idx) => {
            return `${idx + 1}. ${inlineNodeToMarkdown(li).trim()}`;
          });
          if (items.length > 0) parts.push(items.join('\n'));
          continue;
        }

        // 7. Callouts & Blockquotes
        if (tag === 'blockquote' || el.classList.contains('callout') || el.className.includes('callout-bg')) {
          const titleEl = el.querySelector('.font-semibold');
          const alertType = titleEl ? titleEl.textContent.trim().toUpperCase() : '';
          const validAlerts = ['NOTE', 'TIP', 'WARNING', 'IMPORTANT', 'CAUTION'];
          
          const bodyClone = el.cloneNode(true);
          bodyClone.querySelectorAll('.font-semibold, .shrink-0').forEach(n => n.remove());
          const bodyText = inlineNodeToMarkdown(bodyClone).trim();
          const lines = bodyText.split('\n').filter(l => l.trim().length > 0);

          if (validAlerts.includes(alertType)) {
            let calloutLines = [`> [!${alertType}]`];
            lines.forEach(l => calloutLines.push(`> ${l}`));
            parts.push(calloutLines.join('\n'));
          } else {
            parts.push(lines.map(l => `> ${l}`).join('\n'));
          }
          continue;
        }

        // 8. Tables
        const tableEl = tag === 'table' ? el : el.querySelector('table');
        if (tableEl) {
          const rows = Array.from(tableEl.querySelectorAll('tr'));
          if (rows.length > 0) {
            const tableLines = [];
            rows.forEach((tr, rIdx) => {
              const cells = Array.from(tr.querySelectorAll('th, td')).map(c => inlineNodeToMarkdown(c).trim());
              tableLines.push(`| ${cells.join(' | ')} |`);
              if (rIdx === 0) {
                tableLines.push(`| ${cells.map(() => '---').join(' | ')} |`);
              }
            });
            parts.push(tableLines.join('\n'));
            continue;
          }
        }

        // 9. Standard paragraphs or divs
        const pText = inlineNodeToMarkdown(el).trim();
        if (pText) {
          parts.push(pText);
        }
      }

      return parts.join('\n\n');
    }

    // ----------------------------------------------------
    // State Management: Current Markdown, Save & History
    // ----------------------------------------------------
    function getCurrentMarkdown() {
      if (editorSource && !editorSource.classList.contains('hidden')) {
        return editorSource.value;
      }
      return domToMarkdown(editorContent);
    }

    // Undo / Redo History Stack
    let historyStack = [];
    let historyIndex = -1;
    const MAX_HISTORY = 40;
    let isApplyingHistory = false;

    function pushHistoryState() {
      if (isApplyingHistory) return;
      const currentMd = getCurrentMarkdown();
      if (historyIndex >= 0 && historyStack[historyIndex] === currentMd) {
        return;
      }
      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }
      historyStack.push(currentMd);
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      }
      historyIndex = historyStack.length - 1;
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        applyHistoryState(historyStack[historyIndex]);
        showSaveStatus('已撤销');
      }
    }

    function redo() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        applyHistoryState(historyStack[historyIndex]);
        showSaveStatus('已恢复');
      }
    }

    function applyHistoryState(md) {
      isApplyingHistory = true;
      currentRawMarkdown = md;
      editorSource.value = md;
      if (editorSource.classList.contains('hidden')) {
        editorContent.innerHTML = parseMarkdownToHtml(md);
        bindCodeCopyButtons();
        bindTaskCheckboxes();
      }
      const count = (editorContent.innerText || editorSource.value || '').trim().length;
      if (bottomStatWords) bottomStatWords.textContent = count + ' 字';
      refreshToc();
      isApplyingHistory = false;
    }

    // Save Status Feedback
    let saveStatusTimer = null;
    let lastSavedContent = '';

    function showSaveStatus(text, duration = 2000) {
      const statusEl = document.getElementById('save-status-text');
      if (!statusEl) return;
      statusEl.textContent = text;
      if (text === '已保存') {
        statusEl.className = 'transition-opacity duration-200 opacity-100 font-medium text-[var(--text-light)]';
      } else if (text === '未保存' || text === '编辑中...') {
        statusEl.className = 'transition-opacity duration-200 opacity-100 font-medium text-amber-500';
      } else if (text === '保存中...') {
        statusEl.className = 'transition-opacity duration-200 opacity-100 font-medium text-blue-500';
      } else if (text === '保存失败') {
        statusEl.className = 'transition-opacity duration-200 opacity-100 font-medium text-rose-500';
      } else {
        statusEl.className = 'transition-opacity duration-200 opacity-100 font-medium text-[var(--text-main)]';
      }
      clearTimeout(saveStatusTimer);
      if (duration > 0) {
        saveStatusTimer = setTimeout(() => {
          statusEl.classList.remove('opacity-100');
          statusEl.classList.add('opacity-0');
        }, duration);
      }
    }

    let autoSaveTimer = null;
    let historyDebounceTimer = null;

    async function saveDocument(isManual = false) {
      clearTimeout(autoSaveTimer);
      const markdownText = getCurrentMarkdown();

      if (!isManual && markdownText === lastSavedContent) {
        return;
      }

      showSaveStatus('保存中...', 0);
      const curTitle = document.getElementById('header-doc-title')?.textContent || '无标题文档';
      const targetPath = currentDocPath || '未命名文档.md';

      try {
        await saveToBackend(targetPath, curTitle, markdownText);
        lastSavedContent = markdownText;
        showSaveStatus('已保存');
      } catch (err) {
        console.error('Save failed:', err);
        showSaveStatus('保存失败');
      }
    }

    // Load and render raw Markdown text
    function loadAndRenderMarkdown(rawText, filename) {
      currentRawMarkdown = rawText;
      lastSavedContent = rawText;
      let title = filename || '无标题文档';
      
      // Extract title from first H1 if available
      for (let l of rawText.split('\n')) {
        let t = l.trim();
        if (t.startsWith('# ')) {
          title = t.substring(2).trim();
          break;
        }
      }

      const headerTitleEl = document.getElementById('header-doc-title');
      if (headerTitleEl) headerTitleEl.textContent = title;
      editorSource.value = rawText;

      // Render Markdown into rich DOM elements!
      const parsedHtml = parseMarkdownToHtml(rawText);
      editorContent.innerHTML = parsedHtml;

      bindCodeCopyButtons();
      bindTaskCheckboxes();
      updateWordStats();

      // Reset history stack for this loaded document
      historyStack = [rawText];
      historyIndex = 0;
    }

    function bindCodeCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.onclick = () => {
          const code = btn.getAttribute('data-code');
          navigator.clipboard.writeText(code);
          btn.textContent = '已复制';
          setTimeout(() => btn.textContent = '复制', 1500);
        };
      });
    }

    function bindTaskCheckboxes() {
      editorContent.querySelectorAll('input[type="checkbox"]').forEach(box => {
        box.onchange = () => {
          const label = box.nextElementSibling;
          if (label) {
            if (box.checked) {
              label.classList.add('line-through', 'text-[var(--text-light)]');
              label.classList.remove('text-[var(--text-main)]');
            } else {
              label.classList.remove('line-through', 'text-[var(--text-light)]');
              label.classList.add('text-[var(--text-main)]');
            }
          }
          updateWordStats();
          pushHistoryState();
          saveDocument(false);
        };
      });
    }

    // Toggle View (Rendered View vs Raw Markdown Source)
    const btnViewRendered = document.getElementById('toggle-view-rendered');
    const btnViewSource = document.getElementById('toggle-view-source');
    const editorContent = document.getElementById('editor-content');
    const editorSource = document.getElementById('editor-source');
    const bottomStatWords = document.getElementById('bottom-stat-words');
    const dynamicToc = document.getElementById('dynamic-toc');

    function adjustTextareaHeight() {
      if (!editorSource || editorSource.classList.contains('hidden')) return;
      editorSource.style.height = 'auto';
      editorSource.style.height = Math.max(editorSource.scrollHeight, window.innerHeight - 260) + 'px';
    }

    window.addEventListener('resize', adjustTextareaHeight);

    btnViewRendered.addEventListener('click', () => {
      if (editorSource.classList.contains('hidden')) return;
      btnViewRendered.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--bg-card)] text-[var(--text-main)] shadow-sm font-medium transition";
      btnViewSource.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-md hover:text-[var(--text-main)] transition";
      
      const curTitle = document.getElementById('header-doc-title')?.textContent || '无标题文档';
      loadAndRenderMarkdown(editorSource.value, curTitle);
      editorContent.classList.remove('hidden');
      editorSource.classList.add('hidden');
      pushHistoryState();
      refreshToc();
    });

    btnViewSource.addEventListener('click', () => {
      if (!editorSource.classList.contains('hidden')) return;
      btnViewSource.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--bg-card)] text-[var(--text-main)] shadow-sm font-medium transition";
      btnViewRendered.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-md hover:text-[var(--text-main)] transition";
      
      // Convert current rendered DOM into clean markdown
      const currentMd = domToMarkdown(editorContent);
      editorSource.value = currentMd;
      editorContent.classList.add('hidden');
      editorSource.classList.remove('hidden');
      adjustTextareaHeight();
      editorSource.focus();
      pushHistoryState();
      refreshToc();
    });

    // Theme Switch
    const themeBtn = document.getElementById('theme-btn');
    const themeDropdown = document.getElementById('theme-dropdown');
    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themeDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', () => {
      themeDropdown.classList.add('hidden');
      contextMenu.classList.add('hidden');
    });

    document.querySelectorAll('.theme-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.documentElement.className = btn.getAttribute('data-theme');
        themeDropdown.classList.add('hidden');
      });
    });

    // View Modes (Focus [Default], Two-column, Three-column)
    const btnFocus = document.getElementById('view-mode-focus');
    const btnTwo = document.getElementById('view-mode-two');
    const btnThree = document.getElementById('view-mode-three');
    const sidebarCol = document.getElementById('col-sidebar');
    const listCol = document.getElementById('col-list');

    function setActiveViewBtn(btn) {
      [btnFocus, btnTwo, btnThree].forEach(b => {
        b.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-md hover:text-[var(--text-main)] transition";
      });
      btn.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--bg-card)] text-[var(--text-main)] shadow-sm font-medium transition";
    }

    btnFocus.addEventListener('click', () => {
      sidebarCol.classList.add('hidden');
      listCol.classList.add('hidden');
      setActiveViewBtn(btnFocus);
    });

    btnTwo.addEventListener('click', () => {
      sidebarCol.classList.add('hidden');
      listCol.classList.remove('hidden');
      setActiveViewBtn(btnTwo);
    });

    btnThree.addEventListener('click', () => {
      sidebarCol.classList.remove('hidden');
      listCol.classList.remove('hidden');
      setActiveViewBtn(btnThree);
    });

    // Word Counter & TOC
    function updateWordStats() {
      const text = editorContent.innerText || editorSource.value || '';
      const count = text.trim().length;
      if (bottomStatWords) {
        bottomStatWords.textContent = count + ' 字';
      }
      refreshToc();
    }

    function refreshToc() {
      if (!dynamicToc) return;
      dynamicToc.innerHTML = '';

      if (editorSource && !editorSource.classList.contains('hidden')) {
        const lines = editorSource.value.split('\n');
        lines.forEach((line, idx) => {
          const match = line.match(/^(#{1,4})\s+(.+)/);
          if (match) {
            const level = match[1].length;
            const text = match[2].trim();
            const a = document.createElement('a');
            a.href = '#';
            a.textContent = text;
            a.className = "block truncate hover:text-[var(--text-main)] transition " + 
              (level === 1 ? 'font-bold text-[var(--text-main)]' : 
               level === 2 ? 'pl-2 font-medium' : 'pl-4 text-[10px]');
            a.onclick = (e) => {
              e.preventDefault();
              const lineHeight = 28;
              reader.scrollTo({ top: idx * lineHeight, behavior: 'smooth' });
            };
            dynamicToc.appendChild(a);
          }
        });
        return;
      }

      const headings = editorContent.querySelectorAll('h1, h2, h3, h4');
      headings.forEach((h, idx) => {
        if (!h.id) h.id = 'heading-' + idx;
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.className = "block truncate hover:text-[var(--text-main)] transition " + 
          (h.tagName === 'H1' ? 'font-bold text-[var(--text-main)]' : 
           h.tagName === 'H2' ? 'pl-2 font-medium' : 'pl-4 text-[10px]');
        a.onclick = (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        dynamicToc.appendChild(a);
      });
    }

    // Dynamic TOC Auto-hide scrollbar (show on scroll, hide when idle)
    let tocScrollTimer = null;
    if (dynamicToc) {
      dynamicToc.addEventListener('scroll', () => {
        dynamicToc.classList.add('scrolling');
        clearTimeout(tocScrollTimer);
        tocScrollTimer = setTimeout(() => {
          dynamicToc.classList.remove('scrolling');
        }, 800);
      });
    }

    editorContent.addEventListener('input', () => {
      const h1 = editorContent.querySelector('h1');
      if (h1 && h1.textContent.trim()) {
        document.getElementById('header-doc-title').textContent = h1.textContent.trim();
      }
      updateWordStats();
      showSaveStatus('未保存', 0);
      clearTimeout(historyDebounceTimer);
      historyDebounceTimer = setTimeout(pushHistoryState, 600);
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => saveDocument(false), 1000);
    });

    editorSource.addEventListener('input', () => {
      adjustTextareaHeight();
      updateWordStats();
      showSaveStatus('未保存', 0);
      clearTimeout(historyDebounceTimer);
      historyDebounceTimer = setTimeout(pushHistoryState, 600);
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => saveDocument(false), 1000);
    });

    // Keyboard Shortcuts: Platform-aware (macOS vs Windows/Linux)
    const shortcutHint = document.getElementById('shortcut-hint');
    if (shortcutHint) {
      shortcutHint.textContent = isMac ? 'Cmd+S 保存' : 'Ctrl+S 保存';
    }

    window.addEventListener('keydown', (e) => {
      const modKey = isMac ? e.metaKey : e.ctrlKey;

      // 1. Save: Cmd+S / Ctrl+S
      if (modKey && !e.altKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveDocument(true);
        return;
      }

      // 2. Redo: Mac: Cmd+Shift+Z, Windows: Ctrl+Y or Ctrl+Shift+Z
      const isRedo = (isMac && modKey && e.shiftKey && e.key.toLowerCase() === 'z') ||
                     (!isMac && ((modKey && e.key.toLowerCase() === 'y') || (modKey && e.shiftKey && e.key.toLowerCase() === 'z')));
      if (isRedo) {
        e.preventDefault();
        redo();
        return;
      }

      // 3. Undo: Cmd+Z / Ctrl+Z
      if (modKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
        return;
      }
    });

    // Auto-save on window blur
    window.addEventListener('blur', () => {
      saveDocument(false);
    });

    // Selection Bubble Toolbar
    const selToolbar = document.getElementById('selection-toolbar');
    
    document.addEventListener('selectionchange', () => {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !selection.toString().trim()) {
        selToolbar.classList.add('hidden');
        selToolbar.classList.remove('flex');
        return;
      }

      if (!editorContent.contains(selection.anchorNode)) {
        selToolbar.classList.add('hidden');
        selToolbar.classList.remove('flex');
        return;
      }

      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      if (rect.width === 0) return;

      selToolbar.classList.remove('hidden');
      selToolbar.classList.add('flex');
      
      const toolbarHeight = 36;
      selToolbar.style.top = Math.max(10, rect.top - toolbarHeight - 8) + 'px';
      selToolbar.style.left = Math.max(10, rect.left + rect.width / 2 - selToolbar.offsetWidth / 2) + 'px';
    });

    document.querySelectorAll('.fmt-btn').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        document.execCommand(btn.getAttribute('data-cmd'), false, null);
        updateWordStats();
        pushHistoryState();
        saveDocument(false);
      });
    });

    document.getElementById('fmt-hl-yellow').addEventListener('mousedown', (e) => {
      e.preventDefault();
      applyHighlight('hl-yellow');
    });

    document.getElementById('fmt-hl-green').addEventListener('mousedown', (e) => {
      e.preventDefault();
      applyHighlight('hl-green');
    });

    document.getElementById('fmt-code').addEventListener('mousedown', (e) => {
      e.preventDefault();
      wrapWithTag('code', 'font-mono text-xs bg-[var(--bg-window)] px-1.5 py-0.5 rounded text-purple-600');
    });

    document.getElementById('fmt-h1').addEventListener('mousedown', (e) => {
      e.preventDefault();
      document.execCommand('formatBlock', false, 'H1');
      updateWordStats();
      pushHistoryState();
      saveDocument(false);
    });

    document.getElementById('fmt-h2').addEventListener('mousedown', (e) => {
      e.preventDefault();
      document.execCommand('formatBlock', false, 'H2');
      updateWordStats();
      pushHistoryState();
      saveDocument(false);
    });

    function applyHighlight(colorClass) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      const mark = document.createElement('mark');
      mark.className = colorClass;
      mark.appendChild(range.extractContents());
      range.insertNode(mark);
      updateWordStats();
      pushHistoryState();
      saveDocument(false);
    }

    function wrapWithTag(tag, className) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      const el = document.createElement(tag);
      if (className) el.className = className;
      el.appendChild(range.extractContents());
      range.insertNode(el);
      updateWordStats();
      pushHistoryState();
      saveDocument(false);
    }

    // Right-Click Context Menu
    const contextMenu = document.getElementById('editor-context-menu');

    editorContent.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      contextMenu.style.top = Math.min(window.innerHeight - 260, e.clientY) + 'px';
      contextMenu.style.left = Math.min(window.innerWidth - 190, e.clientX) + 'px';
      contextMenu.classList.remove('hidden');
    });

    document.getElementById('insert-block-quick-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = e.currentTarget.getBoundingClientRect();
      contextMenu.style.top = (rect.bottom + 6) + 'px';
      contextMenu.style.left = (rect.left - 40) + 'px';
      contextMenu.classList.toggle('hidden');
    });

    document.querySelectorAll('.ctx-item').forEach(item => {
      item.addEventListener('click', () => {
        insertBlockAtCursor(item.getAttribute('data-insert'));
        contextMenu.classList.add('hidden');
      });
    });

    function insertBlockAtCursor(type) {
      editorContent.focus();
      let htmlToInsert = '';
      if (type === 'h1') {
        htmlToInsert = '<h1 class="text-2xl md:text-3xl font-bold text-[var(--text-main)] tracking-tight mt-7 mb-4 pb-2.5 border-b border-[var(--border-subtle)]">一级标题</h1><p></p>';
      } else if (type === 'h2') {
        htmlToInsert = '<h2 class="text-xl font-bold text-[var(--text-main)] tracking-tight mt-8 mb-3">二级标题</h2><p></p>';
      } else if (type === 'h3') {
        htmlToInsert = '<h3 class="text-base font-bold text-[var(--text-main)] tracking-tight mt-6 mb-2">三级标题</h3><p></p>';
      } else if (type === 'task') {
        htmlToInsert = '<div class="flex items-center gap-3 p-1 rounded-xl hover:bg-[var(--bg-window)] cursor-pointer transition"><input type="checkbox" class="w-4 h-4 rounded-md border-[var(--border-strong)] text-[var(--text-main)] focus:ring-0"><span class="text-[14px] leading-relaxed text-[var(--text-main)]">新待办事项</span></div><p></p>';
      } else if (type === 'callout') {
        htmlToInsert = '<div class="p-4 rounded-2xl bg-[var(--callout-bg)] border border-[var(--callout-border)] flex items-start gap-3 text-sm leading-relaxed text-[var(--text-main)] my-4"><div class="w-5 h-5 rounded-lg bg-[var(--text-main)] text-[var(--bg-card)] flex items-center justify-center shrink-0 text-[10px] font-bold mt-0.5">!</div><div><div class="font-semibold text-[var(--text-main)] mb-1">提示标题</div><div>点击输入提示内容...</div></div></div><p></p>';
      } else if (type === 'code') {
        htmlToInsert = '<pre class="p-4 rounded-xl bg-[var(--bg-window)] border border-[var(--border-subtle)] font-mono text-xs text-[var(--text-main)] overflow-x-auto my-3"><code>// 输入代码片段\nfn main() {\n    println!("hello");\n}</code></pre><p></p>';
      } else if (type === 'divider') {
        htmlToInsert = '<hr class="my-6 border-t border-[var(--border-subtle)]"><p></p>';
      }

      document.execCommand('insertHTML', false, htmlToInsert);
      bindTaskCheckboxes();
      updateWordStats();
      pushHistoryState();
      saveDocument(false);
    }

    // Workspace & Document Loading
    async function loadWorkspace() {
      try {
        const res = await fetch('/api/workspace');
        if (!res.ok) return;
        const data = await res.json();
        renderWorkspace(data);
        if (data.length > 0) {
          loadDocument(data[0].path);
        }
      } catch (e) {
        console.log('Running in standalone mode');
      }
    }

    function renderWorkspace(files) {
      const tree = document.getElementById('tree-container');
      const cards = document.getElementById('cards-container');
      const badge = document.getElementById('doc-count-badge');
      
      tree.innerHTML = '';
      cards.innerHTML = '';
      badge.textContent = files.length;

      files.forEach((file, idx) => {
        const treeItem = document.createElement('div');
        treeItem.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl hover:bg-[var(--bg-window)] text-[var(--text-muted)] hover:text-[var(--text-main)] cursor-pointer truncate";
        treeItem.innerHTML = `<svg class="w-3.5 h-3.5 text-[var(--text-light)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span class="truncate">${file.name}</span>`;
        treeItem.onclick = () => loadDocument(file.path);
        tree.appendChild(treeItem);

        const card = document.createElement('div');
        card.className = "doc-card p-3.5 rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-card)] hover:border-[var(--border-strong)] hover:shadow-sm cursor-pointer space-y-2 transition";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-semibold text-xs leading-snug text-[var(--text-main)] truncate">${file.name}</h3>
          </div>
          <p class="text-[11px] leading-relaxed text-[var(--text-muted)] line-clamp-2">${file.snippet || '本地 Markdown 文档'}</p>
          <div class="flex items-center justify-between text-[10px] text-[var(--text-light)] pt-1">
            <span class="px-1.5 py-0.5 rounded-md bg-[var(--bg-window)] text-[var(--text-muted)] font-medium">文档</span>
            <span class="font-mono">${file.word_count || 0} 字</span>
          </div>
        `;
        card.onclick = () => {
          document.querySelectorAll('.doc-card').forEach(c => c.className = "doc-card p-3.5 rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-card)] hover:border-[var(--border-strong)] hover:shadow-sm cursor-pointer space-y-2 transition");
          card.className = "doc-card p-3.5 rounded-2xl border-2 border-[var(--text-main)] bg-[var(--bg-card)] shadow-sm cursor-pointer space-y-2 transition";
          loadDocument(file.path);
        };
        cards.appendChild(card);
      });
    }

    async function loadDocument(path) {
      if (currentDocPath && currentDocPath !== path) {
        await saveDocument(true);
      }
      currentDocPath = path;
      try {
        const res = await fetch('/api/read?path=' + encodeURIComponent(path));
        if (res.ok) {
          const doc = await res.json();
          loadAndRenderMarkdown(doc.content || '', doc.title || path);
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function saveToBackend(path, title, htmlContent) {
      try {
        await fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, title, html_content: htmlContent })
        });
      } catch (e) {
        console.error(e);
      }
    }

    // New Doc Button
    document.getElementById('add-doc-btn').addEventListener('click', () => {
      currentDocPath = '';
      loadAndRenderMarkdown('# 新建文档\n\n点击开始编写内容...', '新建文档');
      editorContent.focus();
    });

    // Local file input (Import .md)
    const openBtn = document.getElementById('open-file-btn');
    const fileInput = document.getElementById('local-file-input');
    openBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
          loadAndRenderMarkdown(ev.target.result, file.name);
        };
        reader.readAsText(file);
        fileInput.value = '';
      }
    });

    // Drag & Drop
    const mask = document.getElementById('drag-drop-mask');
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      mask.classList.remove('hidden');
      mask.classList.add('flex');
    });
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        mask.classList.add('hidden');
        mask.classList.remove('flex');
      }
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      mask.classList.add('hidden');
      mask.classList.remove('flex');
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
          loadAndRenderMarkdown(ev.target.result, file.name);
        };
        reader.readAsText(file);
      }
    });

    // Reading percentage tracking
    const reader = document.getElementById('reader-scroll-area') || document.getElementById('col-reader');
    const progressText = document.getElementById('read-progress');
    reader.addEventListener('scroll', () => {
      const maxScroll = reader.scrollHeight - reader.clientHeight;
      if (maxScroll > 0) {
        const pct = Math.round((reader.scrollTop / maxScroll) * 100);
        progressText.textContent = pct + '%';
      }
    });

    // Initial default Markdown sample
    const sampleMarkdown = `# MarkView 本地 Markdown 编辑与阅读器

基于 Rust 构建的现代化本地 Markdown 知识阅读与所见即所得编辑器。

## 1. 核心设计理念

以数字排版工艺为导向，打造极简、克制且耐看的本地 Markdown 阅读与编辑工具。消解工具界面的压迫感，呈现纯粹的内容本位体验。

> [!NOTE] 设计信条
> 界面的克制，是对阅读者最深的敬意。所有格式调整无需记忆复杂 Markdown 语法符号，交互直达。

## 2. 交互功能指南

- **原地即时编辑**：在正文中任意位置点击即可直接输入，修改实时增量保存。
- **选中文本浮动气泡**：鼠标划词选中文本，上方立即弹出浮动格式工具条（加粗、斜体、删除线、黄色/绿色荧光高亮、行内代码、标题转换）。
- **右键傻瓜式添加块**：在编辑区任意位置点击鼠标右键，唤起结构化块级菜单，支持一键插入一级/二级/三级标题、待办清单、提示引语盒、代码块与分割线。
- **多栏布局切换**：支持三栏（工作台）、双栏（文档列表+正文）与单栏（专注全屏）即时切换。
- **拖拽即开**：支持直接拖拽本地 .md 文件或文件夹到窗口释放打开。

## 3. 功能清单与对比

- [x] 现代化纸质排版与 3 套精选主题（浅灰冷白、温润羊皮、深邃极夜）
- [x] 划词选中文本浮动格式气泡
- [x] 右键傻瓜式插入 H1/H2/H3 标题与块组件
- [x] 原生 Rust 后端本地文件安全读写与扫描
- [ ] 文档双向链接（WikiLink）快速关联

| 维度 | MarkView | 传统编辑器 |
| :--- | :--- | :--- |
| **渲染体验** | 所见即所得流式排版 | 双栏切分预览或纯文本 |
| **内存开销** | 极低（约 2.5 MB） | 臃肿（数百 MB） |
| **操作方式** | 划词气泡 + 右键傻瓜插入 | 强制记忆符号标记 |

## 4. 架构代码片段

\`\`\`rust
pub struct Document {
    pub title: String,
    pub path: std::path::PathBuf,
    pub word_count: usize,
}
\`\`\``;

    // Initialize with sample and load workspace
    loadAndRenderMarkdown(sampleMarkdown, 'MarkView 架构设计规范');
    loadWorkspace();
  </script>
</body>
